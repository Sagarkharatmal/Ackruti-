# One-click deploy of the Chhupan Chhupai game server on Render
# (Render dashboard → New → Blueprint → pick this repository).
services:
  - type: web
    name: chhupan-chhupai-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      # Paste a PostgreSQL connection string (e.g. a free Neon database) so
      # events, chat and leaderboards survive restarts. Leave empty to test.
      - key: DATABASE_URL
        sync: false
